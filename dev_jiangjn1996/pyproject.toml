[project]
name = "bert-teams"
version = "0.1.0"
description = "BERT 中文意图分类课程项目：数据处理、训练、评估、蒸馏剪枝与 Flask 部署"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "flask>=3.0",
    "numpy>=1.26",
    "jieba>=0.42",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fasttext-wheel>=0.9.2",
]
