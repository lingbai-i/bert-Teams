<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业意图分类系统</title>
<style>
  /* ============================================================
     自托管字体：不引任何 CDN，答辩现场断网也不影响渲染。
     MiSans 已按页面实际用到的字符子集化（7.7MB -> 128KB）。
     font-display: swap 保证字体未就绪时先用回退字体渲染，不白屏。
     ============================================================ */
  @font-face {
    font-family: "MiSans";
    src: url("/static/fonts/MiSans-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "MiSans";
    src: url("/static/fonts/MiSans-Bold.woff2") format("woff2");
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/static/fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/static/fonts/JetBrainsMono-Bold.woff2") format("woff2");
    font-weight: 600 700;
    font-style: normal;
    font-display: swap;
  }

  /* ============================================================
     设计令牌：颜色 / 圆角 / 阴影 / 字体
     集中定义便于整体换肤（后续加深色模式只需覆盖这一块变量）
     ============================================================ */
  /* 注册自定义属性：未注册的 <angle> 无法参与 CSS 过渡，
     conic 描边会瞬间跳变而不是平滑旋转。 */
  @property --angle-1 {
    syntax: "<angle>";
    inherits: false;
    initial-value: -75deg;
  }
  @property --angle-2 {
    syntax: "<angle>";
    inherits: false;
    initial-value: -45deg;
  }

  :root {
    --anim-hover-time: 400ms;
    --anim-hover-ease: cubic-bezier(0.25, 1, 0.5, 1);

    --bg:            #F7F8FC;
    --surface:       #FFFFFF;
    --surface-soft:  #FAFBFF;
    --border:        #E9EBF3;
    --border-strong: #DCE0EC;

    --text-1: #171A26;
    --text-2: #565D75;
    --text-3: #939AAD;

    --primary:      #4F6BFF;
    --primary-600:  #3D57E8;
    --primary-soft: #EEF1FF;
    --accent:       #8B5CF6;

    --success:      #0F9D58;
    --success-soft: #EAF8F0;
    --success-line: #BFE6D2;
    --danger:       #D93F3F;
    --danger-soft:  #FDF0F0;
    --danger-line:  #F5CCCC;

    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --r-xl: 24px;

    /* 阴影三级制：贴近 / 悬浮 / 聚焦 */
    --sh-1: 0 1px 2px rgba(23,26,38,.04), 0 1px 3px rgba(23,26,38,.05);
    --sh-2: 0 2px 6px rgba(23,26,38,.05), 0 8px 20px rgba(23,26,38,.06);
    --sh-3: 0 4px 14px rgba(23,26,38,.06), 0 20px 48px rgba(23,26,38,.09);

    /* 字体全部走系统栈，不引外网字体，保证离线可用 */
    --font: "MiSans", "PingFang SC", "HarmonyOS Sans SC",
            "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC",
            system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", "SF Mono", "Cascadia Mono", Consolas,
                "MiSans", monospace;

    /* 玻璃按钮底色：两个主题各一套，浅底需要深玻璃才压得住 */
    --glass-primary: linear-gradient(-75deg, #2B3350, #47537F 42%, #2B3350);
    --glass-ghost: linear-gradient(-75deg,
      rgba(255,255,255,.55), rgba(255,255,255,.96) 42%,
      rgba(255,255,255,.55));
    --glass-primary-text: #F2F5FF;

    /* 点阵网格 */
    --dot: rgba(79, 107, 255, .22);

    /* 「最快」标记：用琥珀金与主色蓝拉开语义距离——
       蓝色代表交互态（当前选中），金色代表性能标记（跑得最快） */
    --best-bg: linear-gradient(180deg, #FFD166, #F2A33C);
    --best-text: #6B3F00;
    --best-glow: rgba(242, 163, 60, .45);
    --best-row: rgba(242, 163, 60, .08);

    /* 动态光晕色相（只存 RGB，透明度在渐变里控，便于做亮核）*/
    --orb-blue: 79, 107, 255;
    --orb-violet: 139, 92, 246;
    --orb-cyan: 56, 189, 248;
    --orb-magenta: 232, 121, 249;
    --orb-teal: 45, 212, 191;
    --orb-alpha: .9;
  }

  /* ============================================================
     深色主题：只覆盖设计令牌，其余样式自动跟随
     ============================================================ */
  [data-theme="dark"] {
    --bg:            #0A0D17;
    --surface:       #121623;
    --surface-soft:  #171C2C;
    --border:        #232942;
    --border-strong: #2E3654;

    --text-1: #EEF0F8;
    --text-2: #A2AAC4;
    --text-3: #6C7492;

    --primary:      #6C84FF;
    --primary-600:  #5A72F0;
    --primary-soft: #1A2140;
    --accent:       #A78BFA;

    --success:      #34D399;
    --success-soft: #0F2A20;
    --success-line: #1E4A37;
    --danger:       #F87171;
    --danger-soft:  #2B1418;
    --danger-line:  #4C2328;

    --sh-1: 0 1px 2px rgba(0,0,0,.5);
    --sh-2: 0 2px 8px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.42);
    --sh-3: 0 4px 18px rgba(0,0,0,.55), 0 26px 60px rgba(0,0,0,.5);

    /* 深色下改回参考实现的「浅玻璃」——这才是这套按钮的原生形态 */
    --glass-primary: linear-gradient(-75deg,
      rgba(120,146,255,.16), rgba(120,146,255,.44) 42%,
      rgba(120,146,255,.16));
    --glass-ghost: linear-gradient(-75deg,
      rgba(255,255,255,.05), rgba(255,255,255,.17) 42%,
      rgba(255,255,255,.05));
    --glass-primary-text: #F4F7FF;

    --dot: rgba(140, 160, 255, .30);

    --best-bg: linear-gradient(180deg, #FFD98A, #F0A93E);
    --best-text: #4A2C00;
    --best-glow: rgba(240, 169, 62, .38);
    --best-row: rgba(240, 169, 62, .12);

    --orb-blue: 118, 142, 255;
    --orb-violet: 167, 139, 250;
    --orb-cyan: 56, 189, 248;
    --orb-magenta: 244, 114, 182;
    --orb-teal: 45, 212, 191;
    --orb-alpha: 1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    color: var(--text-1);
    background-color: var(--bg);
    /* 三个极淡的径向渐变制造空间层次；fixed 保证滚动时不位移 */
    background-image:
      radial-gradient(900px 520px at 12% -8%,  rgba(79,107,255,.14), transparent 62%),
      radial-gradient(760px 460px at 96% 2%,   rgba(139,92,246,.11), transparent 58%),
      radial-gradient(680px 420px at 50% 112%, rgba(56,189,248,.08), transparent 60%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .shell { width: 100%; max-width: 880px; }

  /* ---------------- 页头 ---------------- */
  /* 深色下把光晕提亮，否则整页发闷 */
  [data-theme="dark"] body {
    background-image:
      radial-gradient(900px 520px at 12% -8%,  rgba(108,132,255,.22), transparent 62%),
      radial-gradient(760px 460px at 96% 2%,   rgba(167,139,250,.17), transparent 58%),
      radial-gradient(680px 420px at 50% 112%, rgba(56,189,248,.11), transparent 60%);
  }

  /* 点阵网格：固定在视口上，用径向遮罩向边缘淡出 */
  .bg-dots {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 80% 64% at 50% 0%,
                                        #000 24%, transparent 78%);
    mask-image: radial-gradient(ellipse 80% 64% at 50% 0%,
                                 #000 24%, transparent 78%);
  }
  .dot { fill: var(--dot); }

  /* ---------------- 两侧动态光晕 ----------------
     放在内容栏（max-width 880px）之外的两侧留白处，不遮挡正文。
     用 radial-gradient 自身充当柔光，避免 filter: blur() 的大面积开销；
     动画只改 transform，交给合成器处理，不触发重排重绘。 */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    opacity: var(--orb-alpha);
  }

  /* 三段径向渐变：亮核 -> 中层光晕 -> 透明。
     比单色渐变更像「发光体」，而不是一团平色。 */
  .orb-1 {
    top: -6%;
    left: -12%;
    width: 580px;
    height: 580px;
    background: radial-gradient(circle,
      rgba(var(--orb-blue), .62) 0%,
      rgba(var(--orb-blue), .26) 34%,
      transparent 70%);
    animation: orbA 13s ease-in-out infinite;
  }
  .orb-2 {
    top: 4%;
    right: -14%;
    width: 640px;
    height: 640px;
    background: radial-gradient(circle,
      rgba(var(--orb-magenta), .58) 0%,
      rgba(var(--orb-magenta), .24) 34%,
      transparent 70%);
    animation: orbB 16s ease-in-out infinite;
    animation-delay: -3s;
  }
  .orb-3 {
    top: 40%;
    left: -11%;
    width: 520px;
    height: 520px;
    background: radial-gradient(circle,
      rgba(var(--orb-cyan), .55) 0%,
      rgba(var(--orb-cyan), .22) 36%,
      transparent 70%);
    animation: orbC 14s ease-in-out infinite;
    animation-delay: -6s;
  }
  .orb-4 {
    bottom: -12%;
    right: -10%;
    width: 560px;
    height: 560px;
    background: radial-gradient(circle,
      rgba(var(--orb-violet), .58) 0%,
      rgba(var(--orb-violet), .24) 34%,
      transparent 70%);
    animation: orbD 18s ease-in-out infinite;
    animation-delay: -9s;
  }
  .orb-5 {
    bottom: -8%;
    left: -9%;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle,
      rgba(var(--orb-teal), .52) 0%,
      rgba(var(--orb-teal), .20) 36%,
      transparent 72%);
    animation: orbE 15s ease-in-out infinite;
    animation-delay: -11s;
  }
  .orb-6 {
    top: 44%;
    right: -12%;
    width: 460px;
    height: 460px;
    background: radial-gradient(circle,
      rgba(var(--orb-blue), .50) 0%,
      rgba(var(--orb-blue), .20) 38%,
      transparent 72%);
    animation: orbF 17s ease-in-out infinite;
    animation-delay: -7s;
  }

  /* 每条路径首尾同值，循环处不会跳变。
     单段位移 140~200px 且周期 12~18 秒，峰值约 40px/s——
     比上一版快一倍，肉眼能明确看到游走。 */
  @keyframes orbA {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    33%  { transform: translate3d(150px, 88px, 0) scale(1.16); }
    66%  { transform: translate3d(-80px, 158px, 0) scale(.92); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
  }
  @keyframes orbB {
    0%   { transform: translate3d(0, 0, 0) scale(1.08); }
    33%  { transform: translate3d(-140px, -96px, 0) scale(.92); }
    66%  { transform: translate3d(-56px, 132px, 0) scale(1.18); }
    100% { transform: translate3d(0, 0, 0) scale(1.08); }
  }
  @keyframes orbC {
    0%   { transform: translate3d(0, 0, 0) scale(.94); }
    33%  { transform: translate3d(122px, -118px, 0) scale(1.16); }
    66%  { transform: translate3d(184px, 72px, 0) scale(1.0); }
    100% { transform: translate3d(0, 0, 0) scale(.94); }
  }
  @keyframes orbD {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    33%  { transform: translate3d(-118px, 152px, 0) scale(1.14); }
    66%  { transform: translate3d(-172px, -82px, 0) scale(.9); }
    100% { transform: translate3d(0, 0, 0) scale(1); }
  }
  @keyframes orbE {
    0%   { transform: translate3d(0, 0, 0) scale(1.04); }
    33%  { transform: translate3d(136px, -104px, 0) scale(.92); }
    66%  { transform: translate3d(74px, 96px, 0) scale(1.18); }
    100% { transform: translate3d(0, 0, 0) scale(1.04); }
  }
  @keyframes orbF {
    0%   { transform: translate3d(0, 0, 0) scale(.96); }
    33%  { transform: translate3d(-96px, 128px, 0) scale(1.14); }
    66%  { transform: translate3d(108px, -108px, 0) scale(.94); }
    100% { transform: translate3d(0, 0, 0) scale(.96); }
  }

  .hero { position: relative; margin-bottom: 26px; }

  /* ---------------- 主题切换按钮 ---------------- */
  .theme-toggle {
    all: unset;
    position: absolute;
    top: 0;
    right: 0;
    box-sizing: border-box;
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-2);
    box-shadow: var(--sh-1);
    cursor: pointer;
    transition: color .18s, border-color .18s, transform .18s,
                box-shadow .18s, background .18s;
  }
  .theme-toggle:hover {
    color: var(--primary);
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: var(--sh-2);
  }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-600);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .badge::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -.025em;
    line-height: 1.22;
    margin-bottom: 9px;
    padding-right: 56px;
    /* 深灰到蓝紫的渐变文字：有色彩但不牺牲对比度 */
    background: linear-gradient(115deg, #14172A 8%, #2F44C4 58%, #7C46E8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  [data-theme="dark"] h1 {
    background: linear-gradient(115deg, #FFFFFF 6%, #A9BBFF 52%, #C4A8FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .lede {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.7;
    max-width: 60ch;
  }

  /* ---------------- 主面板 ---------------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    box-shadow: var(--sh-3);
    padding: 24px;
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: .02em;
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-1);
    background: var(--surface-soft);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 11px 13px;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  textarea:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,107,255,.13);
  }

  /* ---------------- 自定义下拉 ----------------
     原生 select 的展开列表由系统渲染、无法用 CSS 定制，
     故自建 listbox：触发器 + 绝对定位面板。 */
  .select { position: relative; margin-bottom: 16px; }

  .select-trigger {
    all: unset;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-1);
    background: var(--surface-soft);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .select-trigger:hover { border-color: #C3CCF7; }
  .select-trigger[aria-expanded="true"],
  .select-trigger:focus-visible {
    outline: none;
    background: var(--surface);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,107,255,.13);
  }
  .select-value {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .select-chevron {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--text-3);
    transition: transform .24s var(--anim-hover-ease), color .18s;
  }
  .select-trigger[aria-expanded="true"] .select-chevron {
    transform: rotate(180deg);
    color: var(--primary);
  }

  .select-menu {
    position: absolute;
    z-index: 30;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    box-shadow: var(--sh-3);
    max-height: 268px;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(-6px) scale(.985);
    transform-origin: top center;
    pointer-events: none;
    transition: opacity .16s var(--anim-hover-ease),
                transform .16s var(--anim-hover-ease);
  }
  .select.open .select-menu {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }

  .select-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border-radius: 9px;
    font-size: 13.5px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .14s, color .14s;
  }
  .select-option:hover,
  .select-option.is-focus {
    background: var(--primary-soft);
    color: var(--text-1);
  }
  .select-option.is-selected {
    background: var(--primary-soft);
    color: var(--primary-600);
    font-weight: 600;
  }
  .opt-name {
    font-family: var(--font-num);
    font-size: 12px;
    color: var(--text-3);
  }
  .select-option.is-selected .opt-name { color: var(--primary-600); opacity: .8; }
  .opt-check {
    width: 14px;
    height: 14px;
    margin-left: auto;
    flex-shrink: 0;
    color: var(--primary);
    opacity: 0;
  }
  .select-option.is-selected .opt-check { opacity: 1; }
  textarea {
    height: 96px;
    resize: vertical;
    line-height: 1.6;
    margin-bottom: 16px;
  }
  textarea::placeholder { color: var(--text-3); }

  /* ============================================================
     玻璃拟态按钮（移植自 Uiverse 参考实现）
     结构：.button-wrap > button > span，外加 .button-shadow 投影层
     ============================================================ */
  .actions { display: flex; gap: 22px; flex-wrap: wrap; }

  .button-wrap {
    position: relative;
    z-index: 2;
    border-radius: 999px;
    background: transparent;
    pointer-events: none;
    transition: transform var(--anim-hover-time) var(--anim-hover-ease);
  }

  /* 投影层：放大一圈再模糊，形成按钮下方的柔和落影 */
  .button-shadow {
    --cut: 1.5em;
    position: absolute;
    width: calc(100% + var(--cut));
    height: calc(100% + var(--cut));
    top: calc(0% - var(--cut) / 2);
    left: calc(0% - var(--cut) / 2);
    filter: blur(clamp(2px, .11em, 8px));
    overflow: visible;
    pointer-events: none;
    transition: filter var(--anim-hover-time) var(--anim-hover-ease);
  }
  .button-shadow::after {
    content: "";
    position: absolute;
    z-index: 0;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(180deg,
                rgba(23,26,38,.26), rgba(23,26,38,.10));
    width: calc(100% - var(--cut) - .25em);
    height: calc(100% - var(--cut) - .25em);
    top: calc(var(--cut) - .55em);
    left: calc(var(--cut) - .75em);
    opacity: 1;
    transition: all var(--anim-hover-time) var(--anim-hover-ease);
  }

  .button-wrap button {
    all: unset;
    box-sizing: border-box;
    display: inline-block;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    z-index: 3;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    pointer-events: auto;
    border-radius: 999px;
    --bw: 1px;
    transition: all var(--anim-hover-time) var(--anim-hover-ease);
  }
  .button-wrap button:disabled { cursor: not-allowed; }
  .button-wrap:has(button:disabled) { opacity: .45; }
  .button-wrap:has(button:disabled) .button-shadow { opacity: .35; }

  /* 玻璃主体：内外两组高光模拟玻璃厚度 */
  .btn-primary {
    background: var(--glass-primary);
    box-shadow:
      inset 0 .125em .125em rgba(0, 0, 0, .30),
      inset 0 -.125em .125em rgba(255, 255, 255, .24),
      0 .25em .125em -.125em rgba(23, 26, 38, .35),
      0 0 0 .18em inset rgba(255, 255, 255, .10);
    backdrop-filter: blur(clamp(1px, .1em, 4px));
  }
  .btn-ghost {
    background: var(--glass-ghost);
    box-shadow:
      inset 0 .125em .125em rgba(23, 26, 38, .07),
      inset 0 -.125em .125em rgba(255, 255, 255, .9),
      0 .25em .125em -.125em rgba(23, 26, 38, .18),
      0 0 0 .18em inset rgba(255, 255, 255, .55);
    backdrop-filter: blur(clamp(1px, .1em, 4px));
  }
  .btn-primary:hover:not(:disabled),
  .btn-ghost:hover:not(:disabled) {
    transform: scale(.975);
    backdrop-filter: blur(.4px);
  }

  /* 文字层：同时作为扫光的定位参照 */
  .button-wrap button span {
    position: relative;
    display: block;
    user-select: none;
    -webkit-user-select: none;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -.005em;
    padding-inline: 1.45em;
    padding-block: .84em;
    transition: all var(--anim-hover-time) var(--anim-hover-ease);
  }
  .btn-primary span {
    color: var(--glass-primary-text);
    text-shadow: 0 .22em .06em rgba(0, 0, 0, .35);
  }
  .btn-ghost span {
    color: var(--text-1);
    text-shadow: 0 .22em .05em rgba(23, 26, 38, .10);
  }
  .button-wrap button:hover:not(:disabled) span {
    text-shadow: .02em .02em .02em rgba(0, 0, 0, .16);
  }

  /* 扫光：靠 background-position 与 --angle-2 联动形成斜向流光。
     深色按钮用 screen（提亮），浅色按钮 screen 不可见，改 overlay。 */
  .button-wrap button span::after {
    content: "";
    display: block;
    position: absolute;
    z-index: 3;
    width: calc(100% - var(--bw));
    height: calc(100% - var(--bw));
    top: calc(var(--bw) / 2);
    left: calc(var(--bw) / 2);
    box-sizing: border-box;
    border-radius: 999px;
    overflow: clip;
    background: linear-gradient(var(--angle-2),
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, .5) 40% 50%,
      rgba(255, 255, 255, 0) 55%);
    background-size: 200% 200%;
    background-position: 0% 50%;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;
    transition:
      background-position calc(var(--anim-hover-time) * 1.25)
        var(--anim-hover-ease),
      --angle-2 calc(var(--anim-hover-time) * 1.25) var(--anim-hover-ease);
  }
  .btn-ghost span::after { mix-blend-mode: overlay; }
  .button-wrap button:hover:not(:disabled) span::after { background-position: 25% 50%; }
  .button-wrap button:active:not(:disabled) span::after {
    background-position: 50% 15%;
    --angle-2: -15deg;
  }

  /* 描边：conic 渐变 + 双层 mask 挖出环形，角度由 --angle-1 驱动旋转 */
  .button-wrap button::after {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0;
    border-radius: 999px;
    width: calc(100% + var(--bw));
    height: calc(100% + var(--bw));
    top: calc(0% - var(--bw) / 2);
    left: calc(0% - var(--bw) / 2);
    padding: var(--bw);
    box-sizing: border-box;
    background:
      conic-gradient(from var(--angle-1) at 50% 50%,
        rgba(79, 107, 255, .95),
        rgba(255, 255, 255, 0) 5% 40%,
        rgba(139, 92, 246, .9) 50%,
        rgba(255, 255, 255, 0) 60% 95%,
        rgba(79, 107, 255, .95)),
      linear-gradient(180deg,
        rgba(255, 255, 255, .55), rgba(255, 255, 255, .55));
    -webkit-mask: linear-gradient(#000 0 0) content-box,
                  linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    box-shadow: inset 0 0 0 calc(var(--bw) / 2) rgba(255, 255, 255, .3);
    transition: all var(--anim-hover-time) var(--anim-hover-ease),
                --angle-1 500ms ease;
  }
  .button-wrap button:hover:not(:disabled)::after { --angle-1: -125deg; }
  .button-wrap button:active:not(:disabled)::after { --angle-1: -75deg; }

  /* 按下时整体前倾 22 度，配合落影变化形成物理按压感 */
  .button-wrap:has(button:hover:not(:disabled)) .button-shadow {
    filter: blur(clamp(2px, .06em, 5px));
  }
  .button-wrap:has(button:active:not(:disabled)) {
    transform: rotate3d(1, 0, 0, 22deg);
  }
  .button-wrap:has(button:active:not(:disabled)) .button-shadow {
    filter: blur(clamp(2px, .1em, 10px));
  }
  .button-wrap:has(button:active:not(:disabled)) .button-shadow::after {
    top: calc(var(--cut) - .42em);
    opacity: .7;
  }

  /* ---------------- 动效 ---------------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes growBar {
    from { width: 0; }
    to   { width: var(--w); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------------- 单模型结果 ---------------- */
  .result {
    display: none;
    margin-top: 22px;
    padding: 22px;
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--success-soft), var(--surface) 78%);
    border: 1px solid var(--success-line);
    box-shadow: var(--sh-2),
                0 18px 44px -20px rgba(15,157,88,.5);
  }
  [data-theme="dark"] .result {
    background: linear-gradient(180deg,
                rgba(52,211,153,.10), var(--surface) 78%);
    box-shadow: var(--sh-2), 0 18px 44px -18px rgba(52,211,153,.28);
  }
  [data-theme="dark"] .intent { color: #4ADE80; }
  .result.error {
    background: linear-gradient(180deg, var(--danger-soft), var(--surface) 78%);
    border-color: var(--danger-line);
  }

  .intent-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    animation: fadeUp .44s cubic-bezier(.22,1,.36,1) both;
  }
  .intent {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.01em;
    color: #0B7A44;
  }
  .result.error .intent { color: var(--danger); }
  .intent .en {
    font-family: var(--font-num);
    font-size: 12.5px;
    font-weight: 400;
    color: var(--text-3);
  }

  .metrics {
    display: flex;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--success-line);
  }
  .metric {
    padding-right: 32px;
    margin-right: 32px;
    border-right: 1px solid rgba(23,26,38,.07);
  }
  .metric:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .metric-k {
    font-size: 11.5px;
    color: var(--text-3);
    letter-spacing: .03em;
    margin-bottom: 5px;
  }
  .metric-v {
    font-family: var(--font-num);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }

  .top3 { margin-top: 20px; }
  .top3-title {
    font-size: 11.5px;
    color: var(--text-3);
    letter-spacing: .03em;
    margin-bottom: 10px;
  }
  .top3-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 13px;
  }
  .bar-label { width: 132px; color: var(--text-2); flex-shrink: 0; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: rgba(23,26,38,.06);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #9AA9FF, #D3DAF5);
    animation: growBar .78s cubic-bezier(.22,1,.36,1) both;
  }
  .top3-item.is-first .bar {
    background: linear-gradient(90deg, var(--primary), var(--accent));
    box-shadow: 0 0 12px rgba(79,107,255,.35);
  }
  .top3-item.is-first .bar-label { color: var(--text-1); font-weight: 600; }
  .bar-value {
    width: 58px;
    text-align: right;
    color: var(--text-2);
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  /* ---------------- 多模型对比 ---------------- */
  .compare { display: none; margin-top: 22px; }

  .compare-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-2);
    overflow: hidden;
    animation: fadeUp .46s cubic-bezier(.22,1,.36,1) both;
  }
  .compare-head {
    padding: 16px 20px 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .compare-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .compare-head span { font-size: 12.5px; color: var(--text-3); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 13px 20px; text-align: left; }
  th {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: .03em;
    background: var(--surface-soft);
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid var(--border); color: var(--text-2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
  tbody tr:hover td { background: rgba(79,107,255,.035); }

  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num { font-family: var(--font-num); color: var(--text-1); }
  td.model-name { color: var(--text-1); font-weight: 600; }

  /* 表格里的模型名：点击后在上方展开该模型的详细结果。
     视觉沿用玻璃按钮的语言——悬停浮现圆角玻璃底 + 描边 + 轻微抬升，
     而不是廉价的虚线下划线。用 button 而非 span 是为了保留
     键盘 Tab 可达性与回车激活。 */
  .model-link {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid transparent;
    padding: 5px 12px;
    /* 仅左侧负外边距：抵消左内边距，保证文字与表头左对齐。
       右侧若也给负值，会把紧随其后的「最快」标签拽进胶囊里造成重叠。 */
    margin: -5px 0 -5px -12px;
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    transition: color .2s var(--anim-hover-ease),
                background .2s var(--anim-hover-ease),
                border-color .2s var(--anim-hover-ease),
                box-shadow .2s var(--anim-hover-ease),
                transform .2s var(--anim-hover-ease);
  }
  .model-link:hover,
  .model-link:focus-visible {
    outline: none;
    color: var(--primary);
    transform: translateY(-1px);
    border-color: var(--border-strong);
    background: var(--glass-ghost);
    box-shadow: var(--sh-1), inset 0 -1px 1px rgba(255, 255, 255, .45);
  }
  .model-link:active { transform: translateY(1px); }

  /* 性能标记：整行暖色底 + 左侧金色细条 */
  tr.best td { background: var(--best-row); }
  tr.best td:first-child { box-shadow: inset 3px 0 0 #F2A33C; }
  /* 交互状态：蓝色只留给它，避免与「最快」混淆 */
  tbody tr.is-active td { background: rgba(79,107,255,.10); }
  tbody tr.is-active td:first-child { box-shadow: inset 3px 0 0 var(--primary); }
  tr.is-active .model-link {
    color: var(--primary);
    background: var(--glass-ghost);
    border-color: var(--border-strong);
  }

  .tag {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: var(--best-bg);
    color: var(--best-text);
    box-shadow: 0 2px 8px var(--best-glow),
                inset 0 -1px 1px rgba(255, 255, 255, .55);
  }
  /* 当前选中行内，「最快」改用主色玻璃标签。
     该行整体已是蓝色语言，旁边再放实心琥珀会两个颜色互抢，显得突兀。
     文字仍是「最快」，信息没有丢失，只是强调色跟随当前状态。
     非选中行保持琥珀金，两行依旧一眼可分。 */
  tr.is-active .tag {
    background: var(--primary-soft);
    color: var(--primary-600);
    box-shadow: inset 0 0 0 1px rgba(79, 107, 255, .45),
                0 2px 6px rgba(79, 107, 255, .22);
  }
  .muted { color: var(--text-3); }

  /* 加载态 */
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px;
    font-size: 13.5px;
    color: var(--text-3);
  }
  .spinner {
    width: 15px; height: 15px;
    border: 2px solid var(--primary-soft);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .72s linear infinite;
    flex-shrink: 0;
  }

  /* 尊重系统的「减少动态效果」偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  @media (max-width: 640px) {
    body { padding: 28px 14px 48px; }
    h1 { font-size: 24px; }
    .metric { padding-right: 20px; margin-right: 20px; }
    .metric-v { font-size: 18px; }
    .bar-label { width: 96px; }
    th, td { padding: 11px 12px; }
  }
</style>
</head>
<body>
<!-- 两侧动态光晕：纯装饰，aria-hidden 且不响应鼠标 -->
<div class="aurora" aria-hidden="true">
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <span class="orb orb-4"></span>
  <span class="orb orb-5"></span>
  <span class="orb orb-6"></span>
</div>

<!-- 点阵网格背景：纯 SVG pattern，不依赖外部资源 -->
<svg class="bg-dots" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <pattern patternUnits="userSpaceOnUse" width="26" height="26" id="dotGrid">
      <circle class="dot" r="1.1" cy="1.6" cx="1.6"></circle>
    </pattern>
  </defs>
  <rect fill="url(#dotGrid)" width="100%" height="100%"></rect>
</svg>

<div class="shell">

  <header class="hero">
    <button class="theme-toggle" id="themeToggle" type="button"
            onclick="toggleTheme()" aria-label="切换深浅色主题">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
      </svg>
    </button>
    <div class="badge">BERT 意图分类 · 多模型对比</div>
    <h1>企业意图分类系统</h1>
    <p class="lede">
      输入一句员工提问，模型自动判断它属于 9 个业务类别中的哪一个。
      支持 BERT 微调、剪枝、量化、BiLSTM 蒸馏多模型横向对比。
    </p>
  </header>

  <section class="panel">
    <label class="field-label" id="modelLabel">选择模型</label>
    <div class="select" id="modelSelect">
      <button type="button" class="select-trigger" id="modelTrigger"
              aria-haspopup="listbox" aria-expanded="false"
              aria-labelledby="modelLabel" onclick="toggleMenu(event)"
              onkeydown="onTriggerKey(event)">
        <span class="select-value" id="modelValue">正在加载模型列表...</span>
        <svg class="select-chevron" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="select-menu" id="modelMenu" role="listbox"
           aria-labelledby="modelLabel"></div>
    </div>

    <label class="field-label" for="inputText">测试文本</label>
    <textarea id="inputText" placeholder="请输入一句话，例如：年假有几天？"
              oninput="refreshButtons()"></textarea>

    <div class="actions">
      <div class="button-wrap">
        <button class="btn-primary" id="btnPredict" onclick="doPredict()"><span>开始分类</span></button>
        <div class="button-shadow"></div>
      </div>
      <div class="button-wrap">
        <button class="btn-ghost" id="btnCompare" onclick="doCompare()"><span>对比全部模型</span></button>
        <div class="button-shadow"></div>
      </div>
      <div class="button-wrap">
        <button class="btn-ghost" id="btnClear" onclick="clearAll()"><span>清空</span></button>
        <div class="button-shadow"></div>
      </div>
    </div>
  </section>

  <div class="result" id="resultBox"></div>
  <div class="compare" id="compareBox"></div>

</div>

<script>
// 类别名的中文展示映射。class.txt 只存英文标签名，此处仅服务于页面可读性，
// 不参与任何推理逻辑；新增类别时需与 data/class.txt 同步维护。
const LABEL_CN = {
  policy_attendance: '考勤制度',
  it_vpn: 'IT 支持',
  finance_expense: '财务报销',
  hr_onboarding: '人力资源',
  admin_logistics: '行政后勤',
  engineering_eq: '工程设备',
  legal_contract: '法务合同',
  sales_marketing: '销售市场',
  other_chitchat: '其他/闲聊'
};

const ESC_MAP = {'&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;'};

function cn(name) { return LABEL_CN[name] || name; }

// 转义 HTML 特殊字符。错误信息会回显用户提交的模型名
// （src/predict.py 的 ValueError 文案含模型名），直接拼进 innerHTML
// 会形成注入点，因此所有来自服务端的文本一律先转义再渲染。
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (ch) { return ESC_MAP[ch]; });
}

// 主题：首次访问跟随系统偏好，用户切换后写入 localStorage 记忆。
const THEME_KEY = 'intent-demo-theme';

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* 隐私模式忽略 */ }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* 忽略 */ }
  if (!saved) {
    saved = (window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
  }
  applyTheme(saved);
})();

let MODELS = [];
let BUSY = false;
let selectedModel = '';
let menuFocus = -1;
let lastCompareRows = [];

async function loadModels() {
  const label = document.getElementById('modelValue');
  try {
    const resp = await fetch('/api/models');
    const data = await resp.json();
    MODELS = data.models || [];
    selectedModel = MODELS.length ? MODELS[0].name : '';
    renderMenu();
  } catch (e) {
    MODELS = [];
    selectedModel = '';
    label.textContent = '模型列表加载失败';
    renderMenu();
  }
  refreshButtons();
}

// ---------- 自定义下拉 ----------
const CHECK_SVG =
  '<svg class="opt-check" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" ' +
  'stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

function renderMenu() {
  const menu = document.getElementById('modelMenu');
  const value = document.getElementById('modelValue');
  if (MODELS.length === 0) {
    menu.innerHTML = '';
    if (value.textContent.indexOf('失败') === -1) {
      value.textContent = '暂无可用的模型';
    }
    return;
  }
  const cur = MODELS.find(function (m) { return m.name === selectedModel; });
  value.textContent = cur ? cur.desc : MODELS[0].desc;
  menu.innerHTML = MODELS.map(function (m, i) {
    const on = m.name === selectedModel;
    return '<div class="select-option' + (on ? ' is-selected' : '') +
           '" role="option" aria-selected="' + on + '" data-i="' + i +
           '" onclick="chooseModel(' + i + ')">' +
           '<span>' + esc(m.desc) + '</span>' +
           '<span class="opt-name">' + esc(m.name) + '</span>' +
           CHECK_SVG + '</div>';
  }).join('');
}

function openMenu() {
  if (MODELS.length === 0) return;
  document.getElementById('modelSelect').classList.add('open');
  document.getElementById('modelTrigger').setAttribute('aria-expanded', 'true');
  menuFocus = MODELS.findIndex(function (m) { return m.name === selectedModel; });
  paintFocus();
}

function closeMenu() {
  document.getElementById('modelSelect').classList.remove('open');
  document.getElementById('modelTrigger').setAttribute('aria-expanded', 'false');
  menuFocus = -1;
}

function toggleMenu(e) {
  if (e) e.stopPropagation();
  if (document.getElementById('modelSelect').classList.contains('open')) closeMenu();
  else openMenu();
}

function paintFocus() {
  const opts = document.querySelectorAll('#modelMenu .select-option');
  for (let k = 0; k < opts.length; k++) {
    opts[k].classList.toggle('is-focus', k === menuFocus);
  }
}

function moveFocus(step) {
  if (!document.getElementById('modelSelect').classList.contains('open')) {
    openMenu();
    return;
  }
  menuFocus = (menuFocus + step + MODELS.length) % MODELS.length;
  paintFocus();
}

function chooseModel(i) {
  if (i < 0 || i >= MODELS.length) return;
  selectedModel = MODELS[i].name;
  renderMenu();
  closeMenu();
  refreshButtons();
}

function onTriggerKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
  else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (document.getElementById('modelSelect').classList.contains('open')) {
      if (menuFocus >= 0) chooseModel(menuFocus);
    } else { openMenu(); }
  } else if (e.key === 'Escape') { closeMenu(); }
}

// 点击面板外部时收起
document.addEventListener('click', function (e) {
  const box = document.getElementById('modelSelect');
  if (box && !box.contains(e.target)) closeMenu();
});

// 调用 /api/predict 并返回统一结构；失败时抛出带可读原因的异常。
async function predictOne(text, model) {
  const resp = await fetch('/api/predict', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, model})
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || '预测失败');
  return data;
}

function fmtConf(c) { return c != null ? (c * 100).toFixed(1) + '%' : '—'; }

// 数字滚动：只对带 data-count 的元素生效，用三次缓出保证收尾自然。
function animateCounts(root) {
  root.querySelectorAll('[data-count]').forEach(function (el) {
    const to = parseFloat(el.dataset.count);
    if (!isFinite(to)) return;
    const dec = parseInt(el.dataset.dec || '1', 10);
    const suffix = el.dataset.suffix || '';
    const dur = 620;
    const t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = (to * eased).toFixed(dec) + suffix;
      if (k < 1) requestAnimationFrame(step);
      else el.textContent = to.toFixed(dec) + suffix;
    }
    requestAnimationFrame(step);
  });
}

function metric(k, v) {
  return '<div class="metric"><div class="metric-k">' + k + '</div>' +
         '<div class="metric-v">' + v + '</div></div>';
}

function renderResult(data) {
  let html = '<div class="intent-row">' +
             '<span class="intent">' + esc(cn(data.intent)) + '</span>' +
             '<span class="en">' + esc(data.intent) + '</span></div>';

  html += '<div class="metrics">' +
          metric('响应时间',
                 '<span data-count="' + data.latency_ms.toFixed(1) +
                 '" data-dec="1" data-suffix=" ms">0.0 ms</span>') +
          metric('置信度',
                 data.confidence != null
                   ? '<span data-count="' + (data.confidence * 100).toFixed(1) +
                     '" data-dec="1" data-suffix="%">0.0%</span>'
                   : '—') +
          metric('模型', esc(data.model)) +
          '</div>';

  if (data.top3 && data.top3.length) {
    html += '<div class="top3"><div class="top3-title">Top3 候选</div>';
    data.top3.forEach(function (pair, i) {
      const name = pair[0], prob = pair[1];
      const pct = prob * 100;
      html += '<div class="top3-item' + (i === 0 ? ' is-first' : '') + '"' +
              ' style="animation:fadeUp .44s cubic-bezier(.22,1,.36,1) both;' +
              'animation-delay:' + (60 + i * 70) + 'ms">' +
              '<span class="bar-label">' + esc(cn(name)) + '</span>' +
              '<div class="bar-track"><div class="bar" style="--w:' +
              pct.toFixed(1) + '%;animation-delay:' + (120 + i * 70) +
              'ms"></div></div>' +
              '<span class="bar-value">' + pct.toFixed(1) + '%</span>' +
              '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="top3"><div class="top3-title muted">' +
            '该模型不输出 Top3 概率分布</div></div>';
  }
  return html;
}

function renderCompare(rows) {
  let fastest = null;
  for (const r of rows) {
    if (r.ok && (fastest === null || r.latency_ms < fastest)) fastest = r.latency_ms;
  }

  let html = '<div class="compare-card"><div class="compare-head">' +
             '<h2>多模型对比</h2><span>共 ' + rows.length +
             ' 个模型 · 点击模型名查看详细结果</span></div>' +
             '<table><thead><tr><th>模型</th><th>意图</th>' +
             '<th class="num">置信度</th><th class="num">响应时间</th>' +
             '</tr></thead><tbody>';

  rows.forEach(function (r, i) {
    const delay = 'style="animation-delay:' + (i * 55) + 'ms"';
    if (!r.ok) {
      html += '<tr ' + delay + '><td class="model-name">' + esc(r.desc) +
              '</td><td colspan="3" class="muted">' + esc(r.error) + '</td></tr>';
      return;
    }
    const best = r.latency_ms === fastest;
    html += '<tr' + (best ? ' class="best"' : '') + ' ' + delay + '>' +
            '<td class="model-name">' +
            '<button type="button" class="model-link" onclick="showDetail(' +
            i + ')">' + esc(r.desc) + '</button>' +
            (best ? '<span class="tag">最快</span>' : '') + '</td>' +
            '<td>' + esc(cn(r.intent)) + '</td>' +
            '<td class="num">' + fmtConf(r.confidence) + '</td>' +
            '<td class="num">' + r.latency_ms.toFixed(1) + ' ms</td>' +
            '</tr>';
  });

  return html + '</tbody></table></div>';
}

// 按钮可用性由「已输入文本 + 有可用模型 + 非请求中」共同决定。
// 空输入时直接禁用，避免依赖原生 alert 弹窗打断演示流程。
function refreshButtons() {
  const hasText = document.getElementById('inputText').value.trim().length > 0;
  const ready = hasText && MODELS.length > 0 && !BUSY;
  document.getElementById('btnPredict').disabled = !ready;
  document.getElementById('btnCompare').disabled = !ready;
  document.getElementById('btnClear').disabled = BUSY;
}

function setBusy(busy) { BUSY = busy; refreshButtons(); }

async function doPredict() {
  const text = document.getElementById('inputText').value.trim();
  const model = selectedModel;
  const box = document.getElementById('resultBox');
  document.getElementById('compareBox').style.display = 'none';
  if (!text || !model) { refreshButtons(); return; }

  box.style.display = 'block';
  box.className = 'result';
  box.innerHTML = '<div class="loading"><div class="spinner"></div>分类中…</div>';
  setBusy(true);
  try {
    box.innerHTML = renderResult(await predictOne(text, model));
    animateCounts(box);
  } catch (e) {
    box.className = 'result error';
    box.innerHTML =
      '<div class="intent-row"><span class="intent">请求失败</span></div>' +
      '<div class="metrics"><div class="metric">' +
      '<div class="metric-k">原因</div>' +
      '<div class="metric-v" style="font-size:14px;font-weight:400">' +
      esc(e.message) + '</div></div></div>';
  } finally {
    setBusy(false);
  }
}

// 逐个模型串行请求：串行才能得到可横向比较的延迟，且避免多模型同时加载
// 造成的内存峰值。对比结果用于答辩主线的「四条路线横向对比表」。
async function doCompare() {
  const text = document.getElementById('inputText').value.trim();
  const box = document.getElementById('compareBox');
  document.getElementById('resultBox').style.display = 'none';
  if (!text || MODELS.length === 0) { refreshButtons(); return; }

  box.style.display = 'block';
  setBusy(true);
  const rows = [];
  try {
    for (let i = 0; i < MODELS.length; i++) {
      const m = MODELS[i];
      box.innerHTML = '<div class="compare-card"><div class="loading">' +
                      '<div class="spinner"></div>正在对比 (' + (i + 1) + '/' +
                      MODELS.length + ')　' + esc(m.desc) + '</div></div>';
      try {
        const data = await predictOne(text, m.name);
        rows.push({desc: m.desc, name: m.name, ok: true, intent: data.intent,
                   confidence: data.confidence, latency_ms: data.latency_ms,
                   top3: data.top3});
      } catch (e) {
        rows.push({desc: m.desc, name: m.name, ok: false, error: e.message});
      }
    }
    lastCompareRows = rows;
    box.innerHTML = renderCompare(rows);
  } finally {
    setBusy(false);
  }
}

// 对比结果已含每个模型的完整预测数据，点模型名直接复用，不再请求一次。
// 结果卡片位于表格上方，故滚动过去，避免用户以为没反应。
function showDetail(i) {
  const r = lastCompareRows[i];
  if (!r || !r.ok) return;
  const box = document.getElementById('resultBox');
  box.style.display = 'block';
  box.className = 'result';
  box.innerHTML = renderResult({intent: r.intent, confidence: r.confidence,
                                latency_ms: r.latency_ms, model: r.name,
                                top3: r.top3});
  animateCounts(box);
  const trs = document.querySelectorAll('#compareBox tbody tr');
  for (let k = 0; k < trs.length; k++) {
    trs[k].classList.toggle('is-active', k === i);
  }
  box.scrollIntoView({behavior: 'smooth', block: 'center'});
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('compareBox').style.display = 'none';
  lastCompareRows = [];
  refreshButtons();
}

loadModels();
</script>
